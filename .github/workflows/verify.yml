name: Godot client verification
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to verify the exported Windows package
        type: string
        default: ''
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonical bridge tests
        run: |
          npm ci --omit=dev --ignore-scripts
          node --test tests/bridge.test.cjs tests/building-comparison.test.cjs tests/shared-bridge.test.cjs tests/room-bridge.test.cjs tests/cloud-bridge.test.cjs tests/cloud-config.test.cjs tests/cloud-backup.test.cjs tests/hero-management.test.cjs tests/progression-management.test.cjs tests/war-management.test.cjs tests/inventory-management.test.cjs tests/realm-management.test.cjs tests/growth-management.test.cjs tests/report-economy.test.cjs tests/progression-playtest.test.cjs tests/growth-support.test.cjs tests/growth-support-http.test.cjs tests/scouting.test.cjs tests/scouting-http.test.cjs tests/world-map-presentation.test.cjs
      - name: Install pinned official Godot
        shell: pwsh
        run: |
          $version = '4.7.2-stable'
          $file = "Godot_v${version}_win64.exe.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version/$file" -OutFile godot.zip
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version/SHA512-SUMS.txt" -OutFile sums.txt
          $expected = ((Get-Content sums.txt | Where-Object { $_.EndsWith($file) }) -split '\s+')[0]
          if ((Get-FileHash godot.zip -Algorithm SHA512).Hash.ToLower() -ne $expected) { throw 'Checksum mismatch' }
          Expand-Archive godot.zip godot
          $engine = (Get-ChildItem godot -Filter '*console.exe').FullName
          "GODOT_BIN=$engine" >> $env:GITHUB_ENV
          "TK_NODE=$((Get-Command node).Source)" >> $env:GITHUB_ENV
      - name: Import and native GDScript checks
        shell: pwsh
        run: |
          New-Item node_modules/.gdignore -ItemType File -Force
          & $env:GODOT_BIN --headless --path . --editor --import 2>&1 | Tee-Object import.log
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path import.log -Pattern 'SCRIPT ERROR:|^ERROR:')) { throw 'Import failed' }
          foreach ($test in @('tests/world_map_test.gd','tests/battle_view_test.gd','tests/client_test.gd','tests/management_test.gd','tests/input_test.gd','tests/map_render_test.gd','tests/pvp_api_test.gd','tests/pvp_ui_test.gd','tests/lobby_api_test.gd','tests/lobby_ui_test.gd','tests/presentation_test.gd','tests/ui_feedback_test.gd','tests/ui_polish_test.gd','tests/growth_route_test.gd','tests/report_economy_test.gd','tests/growth_economy_client_test.gd','tests/scouting_ui_test.gd','tests/scouting_client_test.gd','tests/dispatch_flow_test.gd','tests/army_activity_test.gd','tests/war_visual_test.gd','tests/world_map_art_test.gd','tests/war_interface_test.gd','tests/march_list_test.gd','tests/cloud_lobby_api_test.gd','tests/cloud_lobby_ui_test.gd','tests/cloud_lobby_html_test.gd','tests/hero_management_test.gd','tests/progression_management_test.gd','tests/war_management_test.gd','tests/inventory_management_test.gd','tests/realm_management_test.gd','tests/city_perimeter_test.gd','tests/city_district_polish_test.gd','tests/city_construction_panel_test.gd','tests/rts_city_grid_test.gd','tests/commanding_city_art_test.gd','tests/historic_city_test.gd','tests/historic_suburb_test.gd','tests/historic_structure_client_test.gd','tests/playable_ui_test.gd')) {
            & $env:GODOT_BIN --headless --path . --script $test 2>&1 | Tee-Object test.log
            if ($LASTEXITCODE -ne 0 -or (Select-String -Path test.log -Pattern 'SCRIPT ERROR:|^ERROR:')) { throw "Failed $test" }
          }
          & $env:GODOT_BIN --headless --path . -- --smoke 2>&1 | Tee-Object smoke.log
          if ($LASTEXITCODE -ne 0 -or !(Select-String -Path smoke.log -Pattern GODOT_SMOKE_OK) -or (Select-String -Path smoke.log -Pattern 'SCRIPT ERROR:|^ERROR:')) { throw 'Client smoke failed' }
      - name: Verify exported Windows executable
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPO --pattern '*Windows-x64.zip' --pattern 'SHA256SUMS.txt' --dir release
          $archive = Get-ChildItem release -Filter '*Windows-x64.zip'
          $expected = ((Get-Content release/SHA256SUMS.txt | Where-Object { $_.EndsWith($archive.Name) }) -split '\s+')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Release checksum mismatch' }
          Expand-Archive $archive.FullName release/game
          $process = Start-Process release/game/ThreeKingdoms.exe -ArgumentList '--headless','--','--smoke' -PassThru -RedirectStandardOutput release/smoke.log -RedirectStandardError release/errors.log
          if (!$process.WaitForExit(40000)) { $process.Kill(); throw 'Exported executable timed out' }
          $process.Refresh()
          Get-Content release/smoke.log
          if ($process.ExitCode -ne 0 -or !(Select-String -Path release/smoke.log -Pattern GODOT_SMOKE_OK) -or (Select-String -Path release/errors.log -Pattern 'SCRIPT ERROR:|^ERROR:')) { throw 'Exported executable failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification-logs
          path: |
            *.log
            release/*.log
  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Hydrate pinned PostgreSQL binary symlinks
        run: node -e "const r=require('node:child_process').spawnSync(process.execPath,['scripts/hydrate-symlinks.js'],{cwd:'node_modules/@embedded-postgres/linux-x64',stdio:'inherit'});process.exit(r.status??1)"
      - name: Real PostgreSQL persistence and account service integration
        run: node --test tests/postgres-room-store.test.cjs tests/cloud-postgres.test.cjs
